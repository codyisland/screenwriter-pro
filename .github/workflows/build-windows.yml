name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli
      - name: Build Tauri app
        run: tauri build
      - name: Find installers
        id: find_installers
        run: |
          $installers = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -Filter "*.exe" | Select-Object -ExpandProperty FullName
          $msi = Get-ChildItem -Path "src-tauri\target\release\bundle\msi" -Filter "*.msi" | Select-Object -ExpandProperty FullName
          $portable = Get-ChildItem -Path "src-tauri\target\release" -Filter "screenwriter-pro.exe" | Select-Object -ExpandProperty FullName

          echo "installers=$installers" >> $env:GITHUB_OUTPUT
          echo "msi=$msi" >> $env:GITHUB_OUTPUT
          echo "portable=$portable" >> $env:GITHUB_OUTPUT
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find_installers.outputs.installers }}
            ${{ steps.find_installers.outputs.msi }}
            ${{ steps.find_installers.outputs.portable }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screenwriter-pro-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/screenwriter-pro.exe
          retention-days: 30