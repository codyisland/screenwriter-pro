<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenwriter Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Screenwriter Pro">
<link rel="stylesheet" href="css/app.css">
<style id="element-styles"></style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <nav id="menubar"><span id="brand">Screenwriter <b>Pro</b></span></nav>
    <div id="toolbar">
      <button class="tb" data-drop="split" title="Split the window"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/></svg><span>Split</span></button>
      <button class="tb" data-drop="views" title="Change view"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/><circle cx="6" cy="7" r=".6"/><circle cx="8" cy="7" r=".6"/></svg><span>Views</span></button>
      <button class="tb" data-cmd="viewBeat" title="Beat Board"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="13" width="8" height="7" rx="1"/><path d="M13 16h8"/></svg><span>Beat Board</span></button>
      <button class="tb" data-cmd="toggleStoryMap" title="Show or hide the Story Map"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="7" height="4" rx="2"/><rect x="11" y="14" width="9" height="4" rx="2"/><path d="M3 21h18M3 3v18"/></svg><span>Story Map</span></button>
      <button class="tb" data-cmd="titlePage" title="Title Page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 15h5"/></svg><span>Title Page</span></button>
      <label class="tb tb-elements"><select id="element-select" title="Element (Alt+1…9)"></select><span>Elements</span></label>
      <button class="tb" data-cmd="writingStats" title="Writing Stats"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="4" height="9" rx="1"/><rect x="10" y="5" width="4" height="15" rx="1"/><rect x="16" y="8" width="4" height="12" rx="1"/></svg><span>Writing Stats</span></button>
      <button class="tb" data-drop="showhide" title="Show or hide items"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Show/Hide</span></button>
      <button class="tb" data-cmd="navigator" id="nav-toggle" title="Navigator"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M3 14h18M9 10v9"/></svg><span>Navigator</span></button>
      <button class="tb" data-cmd="find" title="Find and Replace"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg><span>Find</span></button>
    </div>
  </header>
  <div id="storymap" hidden></div>
  <main id="workspace">
    <aside id="navigator">
      <div id="nav-tabs"></div>
      <div id="nav-body"></div>
    </aside>
    <section id="panes">
      <div class="pane" id="pane-a"></div>
      <div class="pane" id="pane-b" hidden></div>
    </section>
  </main>
  <footer id="statusbar">
    <span id="st-element"></span>
    <span id="st-scene"></span>
    <span id="st-page"></span>
    <span id="st-words"></span>
    <span id="st-target"></span>
    <span id="st-sprint"></span>
    <span id="rev-indicator" hidden></span>
    <span id="track-indicator" hidden>TRACKING</span>
    <span id="st-saved"></span>
  </footer>
</div>
<div id="smarttype" class="popup" hidden></div>
<div id="menu-popup" class="popup" hidden></div>
<div id="modal-root"></div>
<div id="print-root"></div>
<input type="file" id="file-input" hidden>

<script src="js/core.js"></script>
<script src="js/editor.js"></script>
<script src="js/paginate.js"></script>
<script src="js/io.js"></script>
<script src="js/views.js"></script>
<script src="js/storymap.js"></script>
<script src="js/tools.js"></script>
<script src="js/reports.js"></script>
<script src="js/menus.js"></script>
<script src="js/native.js"></script>
<script src="js/main.js"></script>
<script>if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
